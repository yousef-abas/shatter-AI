<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تطبيق ريان - الأذكار الشاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  
  body {
    background: #03045e;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .phone-frame {
    width: 100%;
    max-width: 450px;
    height: 100vh;
    max-height: 900px;
    background: #f4f8fb;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  @media(min-width: 451px) {
    .phone-frame { border-radius: 35px; border: 8px solid #023e8a; }
  }

  /* ── 1. الشاشة الافتتاحية ── */
  #splash-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0077b6 0%, #03045e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    padding: 20px;
    text-align: center;
  }
  #splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-icon {
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: pulseGlow 2s infinite alternate;
  }
  @keyframes pulseGlow {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(0,180,216,0.3); }
    100% { transform: scale(1.08); box-shadow: 0 0 25px rgba(0,180,216,0.6); }
  }

  .splash-title {
    font-size: 3.2rem;
    color: #fff;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  
  .splash-subtitle-custom {
    font-size: 1rem;
    color: #90e0ef;
    font-weight: 600;
    margin-bottom: 25px;
    letter-spacing: 0.5px;
  }

  .enter-btn {
    background: #00b4d8;
    color: #fff;
    border: none;
    padding: 14px 45px;
    border-radius: 30px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,180,216,0.4);
    transition: transform 0.2s, background 0.2s;
  }
  .enter-btn:hover { background: #0096c7; }
  .enter-btn:active { transform: scale(0.95); }

  /* ── 2. الهيدر والمحتوى ── */
  .app-header {
    background: linear-gradient(135deg, #0077b6, #03045e);
    color: #fff;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    z-index: 10;
  }
  .app-header h1 { font-size: 1.35rem; font-weight: 700; }
  .app-header p { font-size: 0.75rem; color: #ade8f4; }

  .back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }

  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
  }

  .grid-menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-bottom: 10px;
  }

  .grid-item {
    background: #ffffff;
    border-radius: 16px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,118,182,0.06);
    border: 1px solid #e0f2fe;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 120px;
  }
  .grid-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,118,182,0.12);
    border-color: #00b4d8;
  }
  .grid-item:active { transform: scale(0.96); }
  .grid-item .icon { font-size: 2.3rem; margin-bottom: 8px; }
  .grid-item .title { font-size: 0.95rem; font-weight: 700; color: #1e293b; }

  /* تذييل الصفحة باللغة الإنجليزية في الأسفل */
  .app-footer-credit {
    text-align: center;
    font-size: 0.75rem;
    color: #94a3b8;
    padding: 10px 0 5px 0;
    font-family: sans-serif;
    letter-spacing: 0.5px;
  }

  /* ── 3. عرض الأذكار الداخلية والزر الكبير المميز ── */
  .section-view {
    display: none;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 40px;
  }
  .section-view.active { display: flex; }

  .thikr-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    border: 1px solid #e2e8f0;
    border-right: 5px solid #0077b6;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .thikr-card.completed {
    opacity: 0.55;
    background: #f8fafc;
    border-right-color: #cbd5e1;
  }
  .thikr-text {
    font-size: 1.15rem;
    line-height: 1.95;
    color: #0f172a;
    text-align: right;
  }
  .thikr-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: #64748b;
    border-top: 1px solid #f1f5f9;
    padding-top: 8px;
  }

  .big-counter-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 5px;
  }
  .big-sebha-btn {
    width: 100%;
    background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,119,182,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .big-sebha-btn:active {
    transform: scale(0.97);
  }
  .big-sebha-btn.done {
    background: linear-gradient(135deg, #cbd5e1 0%, #e2e8f0 100%);
    color: #475569;
    box-shadow: none;
  }
  .count-badge {
    background: rgba(255, 255, 255, 0.25);
    padding: 2px 12px;
    border-radius: 20px;
    font-size: 1rem;
  }
</style>
</head>
<body>

  <div class="phone-frame">
    
    <!-- الشاشة الافتتاحية -->
    <div id="splash-screen">
      <div class="splash-icon">📖</div>
      <div class="splash-title">ريـان</div>

    <!-- الهيدر العلوي -->

    <!-- محتوى التطبيق والأقسام -->
    <div class="main-content">
      <div class="grid-menu" id="gridMenu">
        <div class="grid-item" onclick="openSection('morning')">
          <div class="icon">🌅</div>
          <div class="title">أذكار الصباح</div>
        </div>

          <div class="title">أذكار النوم</div>
        </div>
        <div class="grid-item" onclick="openSection('wakeup')">
          <div class="icon">⏰</div>
          <div class="title">أذكار الاستيقاظ</div>
        </div>
        <div class="grid-item" onclick="openSection('mosque')">
          <div class="icon">🕌</div>
          <div class="title">أذكار المسجد</div>
        </div>
        <div class="grid-item" onclick="openSection('home')">
          <div class="icon">🏠</div>
          <div class="title">أذكار البيت</div>
        </div>
        <div class="grid-item" onclick="openSection('food')">
          <div class="icon">🍲</div>
          <div class="title">أذكار الطعام</div>
        </div>
        <div class="grid-item" onclick="openSection('salah')">
          <div class="icon">🤲</div>
          <div class="title">أذكار الصلاة</div>
        </div>
        <div class="grid-item" onclick="openSection('wudu')">
          <div class="icon">💧</div>
          <div class="title">أذكار الوضوء</div>
        </div>
        <div class="grid-item" onclick="openSection('travel')">
          <div class="icon">✈️</div>
          <div class="title">أذكار السفر</div>
        </div>
        <div class="grid-item" onclick="openSection('praise')">
          <div class="icon">📿</div>
          <div class="title">التسبيح والتهليل</div>
        </div>
        <div class="grid-item" onclick="openSection('ruqyah')">
          <div class="icon">🛡️</div>
          <div class="title">الرقية الشرعية</div>
        </div>
      </div>

      <!-- عرض الأذكار والزر الكبير -->
      <div class="section-view" id="sectionView">
        <div id="athkarListContainer"></div>
      </div>

      <!-- التوقيع بالإنجليزية في أسفل الصفحة -->
      <div class="app-footer-credit">Designed & Prepared by Youssef Abbas</div>
    </div>

  </div>

<script>
  const sectionsData = {
    morning: {

        { text: "أَصْبَحْنَا وَأَصْبَحَ المُلْكُ لِلَّهِ، وَالحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1, virtue: "رواه مسلم" },

        { text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.", count: 1, virtue: "سيد الاستغفار" },
        { text: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ (ثلاث مرات).", count: 3, virtue: "دعاء العافية" },

        { text: "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ العَرْشِ العَظِيمِ (سبع مرات).", count: 7, virtue: "كفاه الله ما أهمه" },
        { text: "رَضِيتُ بِاللَّهِ رَبّاً، وَبِالْإِسْلَامِ دِيناً، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيّاً (ثلاث مرات).", count: 3, virtue: "حق على الله أن يرضيه" },
        { text: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ العَلِيمُ (ثلاث مرات).", count: 3, virtue: "لم يضره شيء" },
        { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ (ثلاث مرات).", count: 3, virtue: "أجر عظيم" },
        { text: "يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.", count: 1, virtue: "تفويض الأمر لله" }

      items: [
        { text: "بِسْمِ اللَّهِ (وإن نسي فليقل: بِسْمِ اللَّهِ فِي أَوَّلِهِ وَآخِرِهِ).", count: 1, virtue: "بدء الطعام" },
        { text: "الحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.", count: 1, virtue: "مغفرة الذنوب" }
      ]
    },
    salah: {
      title: "أذكار الصلاة",
      items: [
        { text: "أَسْتَغْفِرُ اللَّهَ (ثلاثاً)، اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ.", count: 1, virtue: "بعد السلام" },
        { text: "سُبْحَانَ اللَّهِ (33)، وَالحَمْدُ لِلَّهِ (33)، وَاللَّهُ أَكْبَرُ (34).", count: 1, virtue: "غفران الخطايا" }
      ]
    },
    wudu: {
      title: "أذكار الوضوء",
      items: [
        { text: "بِسْمِ اللَّهِ.", count: 1, virtue: "البداية" },
        { text: "أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ... واجْعَلْنِي مِنَ المُتَطَهِّرِينَ.", count: 1, virtue: "أبواب الجنة" }
      ]
    },
    travel: {
      title: "أذكار السفر",
      items: [
        { text: "سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ.", count: 1, virtue: "عند الركوب" },
        { text: "اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ.", count: 1, virtue: "تسهيل السفر" }
      ]
    },
    praise: {
      title: "التسبيح والتهليل",
      items: [
        { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ العَظِيمِ.", count: 33, virtue: "ثقيلتان في الميزان" },
        { text: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.", count: 33, virtue: "كنز من الجنة" },
        { text: "سُبْحَانَ اللَّهِ، وَالحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ.", count: 33, virtue: "أحب الكلام" }
      ]
    },
    ruqyah: {
      title: "الرقية الشرعية",
      items: [
        { text: "بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ...", count: 3, virtue: "الشفاء والتحصين" }
      ]
    }
  };

  let activeCounters = {};

  document.getElementById('enterAppBtn').addEventListener('click', function() {
    document.getElementById('splash-screen').classList.add('hidden');
  });

  document.getElementById('backBtn').addEventListener('click', function() {
    goHome();
  });

  function openSection(sectionKey) {
    const data = sectionsData[sectionKey];
    if (!data) return;

    document.getElementById('headerTitle').innerText = data.title;
    document.getElementById('headerSub').innerText = "حصن المسلم - يوسف عباس";
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('gridMenu').style.display = 'none';
    
    const view = document.getElementById('sectionView');
    view.classList.add('active');

    activeCounters[sectionKey] = {};
    data.items.forEach((item, idx) => {
      activeCounters[sectionKey][idx] = item.count;
    });

    renderSectionItems(sectionKey);
  }

  function renderSectionItems(sectionKey) {
    const data = sectionsData[sectionKey];
    const container = document.getElementById('athkarListContainer');
    container.innerHTML = '';

    data.items.forEach((item, idx) => {
      const remaining = activeCounters[sectionKey][idx];
      const isDone = remaining === 0;

      const card = document.createElement('div');
      card.className = `thikr-card ${isDone ? 'completed' : ''}`;
      
      card.innerHTML = `
        <div class="thikr-text">${item.text}</div>
        <div class="thikr-info">
          <span>فضل الذكر: ${item.virtue}</span>
          <span>الهدف: ${item.count}</span>
        </div>
        <div class="big-counter-box">
          <button class="big-sebha-btn ${isDone ? 'done' : ''}" onclick="decreaseCount('${sectionKey}', ${idx})">
            <span>📿 اضغط للعد والسباحة</span>
            <span class="count-badge">${isDone ? 'تم ✓' : remaining}</span>
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function decreaseCount(sectionKey, idx) {
    if (activeCounters[sectionKey][idx] > 0) {
      activeCounters[sectionKey][idx]--;
      renderSectionItems(sectionKey);
    }
  }

  function goHome() {
    document.getElementById('headerTitle').innerText = "حصن المسلم";
    document.getElementById('headerSub').innerText = "أذكار من صحيح السنة النبوية";
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('gridMenu').style.display = 'grid';
    document.getElementById('sectionView').classList.remove('active');
  }
</script>

</body>
</html>
