<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تطبيق ريان - الأذكار الشاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  
  body {
    background: #03045e;
    color: #333;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* الحاوية الرئيسية للتطبيق (تصميم هاتف راقي) */
  .phone-frame {
    width: 100%;
    max-width: 450px;
    height: 100vh;
    max-height: 900px;
    background: #f4f8fb;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  @media(min-width: 451px) {
    .phone-frame { border-radius: 35px; border: 8px solid #023e8a; }
  }

  /* ── 1. الشاشة الافتتاحية ── */
  #splash-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0077b6 0%, #03045e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    padding: 20px;
    text-align: center;
  }
  #splash-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-icon {
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: pulseGlow 2s infinite alternate;
  }
  @keyframes pulseGlow {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(0,180,216,0.3); }
    100% { transform: scale(1.08); box-shadow: 0 0 25px rgba(0,180,216,0.6); }
  }

  .splash-title {
    font-size: 3.2rem;
    color: #fff;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .splash-author {
    font-size: 1.15rem;
    color: #ade8f4;
    margin-bottom: 35px;
    font-weight: 600;
  }
  .enter-btn {
    background: #00b4d8;
    color: #fff;
    border: none;
    padding: 14px 45px;
    border-radius: 30px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(0,180,216,0.4);
    transition: transform 0.2s, background 0.2s;
  }
  .enter-btn:hover { background: #0096c7; }
  .enter-btn:active { transform: scale(0.95); }

  /* ── 2. محتوى التطبيق ── */
  .app-header {
    background: linear-gradient(135deg, #0077b6, #03045e);
    color: #fff;
    padding: 20px 20px 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    z-index: 10;
  }
  .app-header h1 { font-size: 1.35rem; font-weight: 700; }
  .app-header p { font-size: 0.75rem; color: #ade8f4; }

  .back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }

  /* الأقسام الرئيسية (Grid) */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
  }

  .grid-menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-bottom: 20px;
  }

  .grid-item {
    background: #ffffff;
    border-radius: 16px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,118,182,0.06);
    border: 1px solid #e0f2fe;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 120px;
  }
  .grid-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,118,182,0.12);
    border-color: #00b4d8;
  }
  .grid-item:active { transform: scale(0.96); }
  .grid-item .icon { font-size: 2.3rem; margin-bottom: 8px; }
  .grid-item .title { font-size: 0.95rem; font-weight: 700; color: #1e293b; }

  /* ── 3. صفحة عرض الأذكار الداخلية (بصمة احترافية) ── */
  .section-view {
    display: none;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 30px;
  }
  .section-view.active { display: flex; }

  .thikr-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
    border-right: 5px solid #0077b6;
    transition: all 0.3s ease;
  }
  .thikr-card.completed {
    opacity: 0.55;
    background: #f8fafc;
    border-right-color: #cbd5e1;
  }
  .thikr-text {
    font-size: 1.1rem;
    line-height: 1.9;
    color: #0f172a;
    margin-bottom: 14px;
    text-align: right;
  }
  .thikr-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #f1f5f9;
    padding-top: 12px;
  }
  .thikr-virtue {
    font-size: 0.78rem;
    color: #64748b;
    max-width: 62%;
    line-height: 1.4;
  }
  .counter-btn {
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 25px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,118,182,0.3);
    transition: transform 0.1s;
    min-width: 80px;
    text-align: center;
  }
  .counter-btn:active { transform: scale(0.92); }
  .counter-btn.done {
    background: #e2e8f0;
    color: #64748b;
    box-shadow: none;
  }
</style>
</head>
<body>

  <div class="phone-frame">
    
    <!-- 1. الشاشة الافتتاحية -->
    <div id="splash-screen">
      <div class="splash-icon">📖</div>
      <div class="splash-title">ريـان</div>
      <div class="splash-author">إعداد: يوسف عباس</div>
      <button class="enter-btn" onclick="openApp()">دخول التطبيق ✨</button>
    </div>

    <!-- الهيدر العلوي -->
    <div class="app-header">
      <div>
        <h1 id="headerTitle">حصن المسلم</h1>
        <p id="headerSub">أذكار من صحيح السنة النبوية</p>
      </div>
      <button class="back-btn" id="backBtn" onclick="goHome()">⬅</button>
    </div>

    <!-- محتوى التطبيق -->
    <div class="main-content">
      <!-- شبكة الأقسام الرئيسية -->
      <div class="grid-menu" id="gridMenu">
        <div class="grid-item" onclick="openSection('morning')">
          <div class="icon">🌅</div>
          <div class="title">أذكار الصباح</div>
        </div>
        <div class="grid-item" onclick="openSection('evening')">
          <div class="icon">🌙</div>
          <div class="title">أذكار المساء</div>
        </div>
        <div class="grid-item" onclick="openSection('sleep')">
          <div class="icon">🛌</div>
          <div class="title">أذكار النوم</div>
        </div>
        <div class="grid-item" onclick="openSection('wakeup')">
          <div class="icon">⏰</div>
          <div class="title">أذكار الاستيقاظ</div>
        </div>
        <div class="grid-item" onclick="openSection('mosque')">
          <div class="icon">🕌</div>
          <div class="title">أذكار المسجد</div>
        </div>
        <div class="grid-item" onclick="openSection('home')">
          <div class="icon">🏠</div>
          <div class="title">أذكار البيت</div>
        </div>
        <div class="grid-item" onclick="openSection('food')">
          <div class="icon">🍲</div>
          <div class="title">أذكار الطعام</div>
        </div>
        <div class="grid-item" onclick="openSection('salah')">
          <div class="icon">🤲</div>
          <div class="title">أذكار الصلاة</div>
        </div>
        <div class="grid-item" onclick="openSection('wudu')">
          <div class="icon">💧</div>
          <div class="title">أذكار الوضوء</div>
        </div>
        <div class="grid-item" onclick="openSection('travel')">
          <div class="icon">✈️</div>
          <div class="title">أذكار السفر</div>
        </div>
        <div class="grid-item" onclick="openSection('praise')">
          <div class="icon">📿</div>
          <div class="title">التسبيح والتهليل</div>
        </div>
        <div class="grid-item" onclick="openSection('ruqyah')">
          <div class="icon">🛡️</div>
          <div class="title">الرقية الشرعية</div>
        </div>
      </div>

      <!-- عرض الأذكار الداخلية للقسم -->
      <div class="section-view" id="sectionView">
        <div id="athkarListContainer"></div>
      </div>
    </div>

  </div>

<script>
  // قاعدة بيانات ضخمة وشاملة لأذكار حصن المسلم
  const sectionsData = {
    morning: {
      title: "أذكار الصباح",
      items: [
        { text: "أَصْبَحْنَا وَأَصْبَحَ المُلْكُ لِلَّهِ، وَالحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1, virtue: "يُقال مرة واحدة في الصباح" },
        { text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.", count: 1, virtue: "دعاء جامع للصباح" },
        { text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ...", count: 1, virtue: "سَيِّدُ الِاسْتِغْفَارِ" },
        { text: "رَضِيتُ بِاللَّهِ رَبّاً، وَبِالْإِسْلَامِ دِيناً، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيّاً.", count: 3, virtue: "حق على الله أن يرضيه يوم القيامة" },
        { text: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ العَلِيمُ.", count: 3, virtue: "حفظ من كل ضرر حتى يُمسي" },
        { text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.", count: 3, virtue: "أجر عظيم وثواب مضاعف" }
      ]
    },
    evening: {
      title: "أذكار المساء",
      items: [
        { text: "أَمْسَيْنَا وَأَمْسَى المُلْكُ لِلَّهِ، وَالحَمْدُ لِلَّهِ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1, virtue: "يُقال مرة واحدة في المساء" },
        { text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ المَصِيرُ.", count: 1, virtue: "دعاء جامع للمساء" },
        { text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.", count: 3, virtue: "حفظ من كل أذى وضرر" },
        { text: "اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ...", count: 4, virtue: "من قالها أعتقه الله من النار" }
      ]
    },
    sleep: {
      title: "أذكار النوم",
      items: [
        { text: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِه عِبَادَكَ الصَّالِحِينَ.", count: 1, virtue: "دعاء الاضطجاع للنوم" },

        { text: "بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.", count: 1, virtue: "دعاء دخول المسجد" },
        { text: "اللَّهُمَّ إِنِّى أَسْأَلُكَ مِنْ فَضْلِكَ.", count: 1, virtue: "عند الخروج من المسجد" }

    },
    travel: {

        { text: "اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا البِرَّ وَالتَّقْوَى، وَمِنَ العَمَلِ مَا تَرْضَى.", count: 1, virtue: "دعاء السفر المبارك" }
      ]
    },
    praise: {
      title: "التسبيح والتهليل",
      items: [
        { text: "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ.", count: 10, virtue: "أحب الكلام إلى الله" },
        { text: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.", count: 10, virtue: "كنز من كنوز الجنة" }
      ]
    },
    ruqyah: {
      title: "الرقية الشرعية",
      items: [
        { text: "بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ.", count: 3, virtue: "الرقية النبوية الشريفة" },
        { text: "قُلْ هُوَ اللَّهُ أَحَدٌ.. وَالمُعَوِّذَتَيْنِ (ثلاث مرات).", count: 3, virtue: "تُكفيك من كل شيء" }
      ]
    }
  };

  let activeCounters = {};

  function openApp() {
    document.getElementById('splash-screen').classList.add('hidden');
  }

  function openSection(sectionKey) {
    const data = sectionsData[sectionKey];
    if (!data) return;

    // تحديث العرض والهيدر
    document.getElementById('headerTitle').innerText = data.title;
    document.getElementById('headerSub').innerText = "حصن المسلم - يوسف عباس";
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('gridMenu').style.display = 'none';
    
    const view = document.getElementById('sectionView');
    view.classList.add('active');

    // تهيئة العدادات
    activeCounters[sectionKey] = {};
    data.items.forEach((item, idx) => {
      activeCounters[sectionKey][idx] = item.count;
    });

    renderSectionItems(sectionKey);
  }

  function renderSectionItems(sectionKey) {
    const data = sectionsData[sectionKey];
    const container = document.getElementById('athkarListContainer');
    container.innerHTML = '';

    data.items.forEach((item, idx) => {
      const remaining = activeCounters[sectionKey][idx];
      const isDone = remaining === 0;

      const card = document.createElement('div');
      card.className = `thikr-card ${isDone ? 'completed' : ''}`;
      card.innerHTML = `
        <div class="thikr-text">${item.text}</div>
        <div class="thikr-footer">
          <div class="thikr-virtue">${item.virtue}</div>
          <button class="counter-btn ${isDone ? 'done' : ''}" onclick="decreaseCount('${sectionKey}', ${idx})">
            ${isDone ? 'تم ✓' : remaining}
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function decreaseCount(sectionKey, idx) {
    if (activeCounters[sectionKey][idx] > 0) {
      activeCounters[sectionKey][idx]--;
      renderSectionItems(sectionKey);
    }
  }

  function goHome() {
    document.getElementById('headerTitle').innerText = "حصن المسلم";
    document.getElementById('headerSub').innerText = "أذكار من صحيح السنة النبوية";
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('gridMenu').style.display = 'grid';
    document.getElementById('sectionView').classList.remove('active');
  }
</script>

</body>
</html>
